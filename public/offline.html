<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#007AFF">
  <meta name="description" content="CRM Application - Offline Mode">
  <title>Offline | CRM</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
    }

    .container {
      text-align: center;
      padding: 40px;
      max-width: 500px;
    }

    .icon {
      width: 120px;
      height: 120px;
      margin: 0 auto 30px;
      animation: pulse 2s infinite;
    }

    @keyframes pulse {
      0%, 100% { transform: scale(1); opacity: 1; }
      50% { transform: scale(1.1); opacity: 0.8; }
    }

    h1 {
      font-size: 2.5rem;
      margin-bottom: 20px;
      font-weight: 700;
    }

    .subtitle {
      font-size: 1.2rem;
      opacity: 0.9;
      margin-bottom: 40px;
      line-height: 1.6;
    }

    .card {
      background: rgba(255, 255, 255, 0.15);
      backdrop-filter: blur(10px);
      border-radius: 20px;
      padding: 30px;
      margin-bottom: 20px;
    }

    .card h2 {
      font-size: 1.3rem;
      margin-bottom: 15px;
    }

    .card p {
      opacity: 0.9;
      font-size: 0.95rem;
    }

    .status {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      padding: 12px 24px;
      background: rgba(255, 255, 255, 0.2);
      border-radius: 50px;
      margin-bottom: 30px;
      font-weight: 500;
    }

    .status-dot {
      width: 10px;
      height: 10px;
      background: #ff6b6b;
      border-radius: 50%;
      animation: blink 1.5s infinite;
    }

    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.3; }
    }

    .online .status-dot {
      background: #51cf66;
    }

    .online .status-dot {
      animation: none;
    }

    .actions {
      display: flex;
      gap: 15px;
      justify-content: center;
      flex-wrap: wrap;
    }

    .btn {
      padding: 15px 30px;
      border: none;
      border-radius: 12px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.2s, box-shadow 0.2s;
    }

    .btn-primary {
      background: white;
      color: #667eea;
    }

    .btn-secondary {
      background: rgba(255, 255, 255, 0.2);
      color: white;
    }

    .btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
    }

    .cached-data {
      text-align: left;
      margin-top: 20px;
    }

    .cached-item {
      display: flex;
      justify-content: space-between;
      padding: 12px 0;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
    }

    .cached-item:last-child {
      border-bottom: none;
    }

    .cached-item span:first-child {
      opacity: 0.8;
    }

    .cached-item span:last-child {
      font-weight: 600;
    }

    .progress {
      margin-top: 20px;
      background: rgba(255, 255, 255, 0.2);
      border-radius: 10px;
      height: 8px;
      overflow: hidden;
    }

    .progress-bar {
      height: 100%;
      background: white;
      border-radius: 10px;
      transition: width 0.3s;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="icon">
      <svg viewBox="0 0 100 100" fill="white">
        <path d="M50 10C27.9 10 10 27.9 10 50s17.9 40 40 40 40-17.9 40-40S72.1 10 50 10zm0 70c-16.5 0-30-13.5-30-30s13.5-30 30-30 30 13.5 30 30-13.5 30-30 30z"/>
        <path d="M50 25c-13.8 0-25 11.2-25 25s11.2 25 25 25 25-11.2 25-25-11.2-25-25-25zm0 40c-8.3 0-15-6.7-15-15s6.7-15 15-15 15 6.7 15 15-6.7 15-15 15z"/>
        <circle cx="50" cy="50" r="8" fill="white"/>
      </svg>
    </div>

    <div class="status">
      <div class="status-dot"></div>
      <span id="statusText">Checking connection...</span>
    </div>

    <h1>You're Offline</h1>
    <p class="subtitle">
      Don't worry! Your data is safe. Some features are still available offline, and your changes will sync automatically when you're back online.
    </p>

    <div class="card">
      <h2>Available Offline</h2>
      <div class="cached-data" id="cachedData">
        <div class="cached-item">
          <span>Dashboard</span>
          <span>✓ Cached</span>
        </div>
        <div class="cached-item">
          <span>Contacts</span>
          <span id="contactsStatus">Loading...</span>
        </div>
        <div class="cached-item">
          <span>Leads</span>
          <span id="leadsStatus">Loading...</span>
        </div>
        <div class="cached-item">
          <span>Deals</span>
          <span id="dealsStatus">Loading...</span>
        </div>
      </div>

      <div class="progress">
        <div class="progress-bar" id="progressBar" style="width: 0%"></div>
      </div>
    </div>

    <div class="actions">
      <button class="btn btn-primary" onclick="retryConnection()">
        Try Again
      </button>
      <button class="btn btn-secondary" onclick="viewCachedData()">
        View Cached Data
      </button>
    </div>
  </div>

  <script>
    async function checkConnection() {
      try {
        const response = await fetch('/api/health', { method: 'GET' });
        if (response.ok) {
          document.body.classList.add('online');
          document.querySelector('.status-dot').style.background = '#51cf66';
          document.getElementById('statusText').textContent = 'Back Online!';
          setTimeout(() => {
            window.location.reload();
          }, 1500);
        }
      } catch (error) {
        document.body.classList.remove('online');
        document.querySelector('.status-dot').style.background = '#ff6b6b';
        document.getElementById('statusText').textContent = 'Offline';
      }
    }

    async function getCachedData() {
      if ('caches' in window) {
        try {
          const cacheNames = await caches.keys();
          const crmCache = cacheNames.find(name => name.includes('dynamic') || name.includes('static'));
          
          if (crmCache) {
            const cache = await caches.open(crmCache);
            const keys = await cache.keys();
            const apiRequests = keys.filter(req => req.url.includes('/api/'));
            
            document.getElementById('contactsStatus').textContent = 
              apiRequests.some(r => r.url.includes('/contacts')) ? '✓ Cached' : 'Not cached';
            document.getElementById('leadsStatus').textContent = 
              apiRequests.some(r => r.url.includes('/leads')) ? '✓ Cached' : 'Not cached';
            document.getElementById('dealsStatus').textContent = 
              apiRequests.some(r => r.url.includes('/deals')) ? '✓ Cached' : 'Not cached';
            
            const progress = (apiRequests.length / 5) * 100;
            document.getElementById('progressBar').style.width = `${Math.min(progress, 100)}%`;
          }
        } catch (error) {
          console.error('Error getting cached data:', error);
        }
      }
    }

    function retryConnection() {
      document.getElementById('statusText').textContent = 'Checking...';
      checkConnection();
    }

    function viewCachedData() {
      alert('Opening cached data viewer...\n\nYou can view your cached contacts, leads, and deals here.');
    }

    // Check connection on load
    checkConnection();
    
    // Check for cached data
    getCachedData();

    // Listen for online event
    window.addEventListener('online', () => {
      checkConnection();
    });

    window.addEventListener('offline', () => {
      document.body.classList.remove('online');
      document.querySelector('.status-dot').style.background = '#ff6b6b';
      document.getElementById('statusText').textContent = 'Offline';
    });

    // Periodic connection check
    setInterval(checkConnection, 30000);
  </script>
</body>
</html>
